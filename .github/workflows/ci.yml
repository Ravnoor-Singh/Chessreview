name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n catalogue check
        run: npm run i18n:check

      - name: Glossary consistency (canonical terms + never-translate)
        run: npm run glossary:check

      - name: Theme registry check (ids, labels, contrast, provenance)
        run: npm run themes:check

      - name: Format check (repo-wide prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Engine integration tests (real Stockfish, Node)
        run: npm run test:integration

      - name: Engine bundle profiles (shipped-file lists per ENGINE_BUNDLE)
        run: npm run test:profiles

      - name: Unused source files (import-graph reachability)
        run: npm run check:unused

      # Policy (SECURITY.md): high/critical production findings fail the
      # job; moderate and below are reported but do not block.
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      # Coverage thresholds are enforced by vitest.coverage.config.ts
      # (critical modules at the Prompt 5 bar, global floor ratcheted
      # from measured totals). One leg is enough for the report.
      - name: Coverage (thresholds enforced)
        if: matrix.node == 20
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e (light — PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run light e2e tests
        run: npm run test:e2e:light -- --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (mobile, median of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (includes the bundle-budget check)
        run: npm run build

      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium

      # lighthouserc.cjs asserts accessibility / best-practices / SEO as
      # errors and performance as a warning (lab timings vary by runner);
      # measured medians are recorded in PERFORMANCE.md.
      - name: Run Lighthouse CI
        run: |
          export CHROME_PATH="$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
          npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 7

  e2e-heavy:
    name: Playwright e2e (heavy — real-engine flows)
    # Heavy specs run real Stockfish analyses for minutes; they gate
    # merges to main and manual runs, not every PR (Round 2, Prompt 4).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run heavy e2e tests (incl. no-isolation pool project)
        run: npm run test:e2e:heavy -- --reporter=list,html

      - name: Run cross-origin CDN engine e2e (Prompt 7)
        run: npm run test:e2e:cdn -- --reporter=list

      - name: Run lite-only profile e2e (Prompt 7)
        run: npm run test:e2e:lite -- --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-heavy
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
